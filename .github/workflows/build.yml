name: build

on:
  push:
    branches:
      - '*'
    tags:
      - v*
  pull_request:
    branches:
      - '*'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::Run 'gofmt -w' on these files:"
            echo "$unformatted"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      # Let every platform finish (and keep its log) even if another one fails
      fail-fast: false
      max-parallel: 5
      matrix:
        platform: [
          client,
          android-arm, android-arm64, android-x64, android-x86,
          darwin-x64, darwin-arm64,
          linux-armv6, linux-armv7, linux-armv7_softfp, linux-arm64, linux-x64, linux-x86,
          windows-x64, windows-x86 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get tags
        run: |
          git fetch --tags origin
          git fetch --prune --unshallow

      - name: Get Go environment
        id: go-env
        run: |
          mkdir -p ~/.cache/go-build
          mkdir -p ~/.cache/go-cache
          mkdir -p ~/.cache/go-modcache
          echo "GOPATH=$(readlink -f ~/.cache/go-build)" >> $GITHUB_ENV
          echo "GOCACHE=$(readlink -f ~/.cache/go-cache)" >> $GITHUB_ENV
          echo "GOMODCACHE=$(readlink -f ~/.cache/go-modcache)" >> $GITHUB_ENV

      - name: Set up cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.GOPATH }}
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          # Per platform: the cgo/SWIG build cache is platform specific
          key: elementum-${{ runner.os }}-${{ matrix.platform }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            elementum-${{ runner.os }}-${{ matrix.platform }}-go-

      - name: Build ${{ matrix.platform }}
        run: | 
          make ${{ matrix.platform }} 
          make ${{ matrix.platform }}-shared

      - name: Generate ${{ matrix.platform }} zip
        id: generate_zip
        run: |
          make zip PLATFORM=${{ matrix.platform }}
          asset_path=$(ls build/*.zip)
          echo "asset_path=${asset_path}" >> "$GITHUB_OUTPUT"
          echo "asset_name=$(basename "${asset_path}")" >> "$GITHUB_OUTPUT"

      - name: Upload ${{ matrix.platform }} zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: ${{ steps.generate_zip.outputs.asset_path }}

  bundle:
    name: Bundle all platforms
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract and re-bundle all platforms
        run: |
          cd artifacts

          for d in */; do
            echo "Processing $d"
            find "$d" -name '*.zip' -exec unzip -o -d "$d" {} \; -delete
          done

          for d in */; do
            dir_name="${d%/}"
            new_name="${dir_name//-/_}"
            if [ "$dir_name" != "$new_name" ]; then
              echo "Renaming $dir_name to $new_name"
              mv "$dir_name" "$new_name"
            fi
          done

          zip -r ../elementum-binaries.zip .

      - name: Upload combined zip
        uses: actions/upload-artifact@v7
        with:
          name: elementum-binaries
          path: elementum-binaries.zip

  # TODO: Remove when ready with release process
  # release:
  #   name: Release
  #   runs-on: ubuntu-22.04
  #   needs: build
  #   if: success() && github.event_name == 'create' && startsWith(github.ref, 'refs/tags/')
  #   steps:
  #     - name: Perform release
  #       run: |
  #         ./push-binaries.sh
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-downstream:
    name: Trigger plugin.video.elementum build
    runs-on: ubuntu-latest
    needs: bundle
    steps:
      - name: Trigger workflow in plugin.video.elementum
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'elgatito',
              repo: 'plugin.video.elementum',
              workflow_id: 'build.yml',
              ref: 'master',
              inputs: {
                binaries_branch: context.refName
              }
            });
            